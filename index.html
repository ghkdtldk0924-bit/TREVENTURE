<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#102b12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <meta name="description" content="Treventure - 가족과 함께 떠나는 트레이더스 탐험">
  <title>Treventure</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="bg"></div>
  <main id="app" aria-label="Treventure 모바일 게임">
    <section id="stage" class="stage" data-fx="on">
      <div id="world" class="world">
        <img id="img-a" class="screen-image" alt="" draggable="false">
        <img id="img-b" class="screen-image" alt="" draggable="false">
        <div id="fx" class="fx"></div>
        <div id="ui" class="ui"></div>
        <div id="hotspots" class="hotspots"></div>
        <div id="hud" class="hud" aria-live="polite"><i class="coin">T</i><b id="coin-n">60</b><i class="plus">+</i></div>
        <div id="hp" class="hpbar"><i></i><span></span></div>
      </div>
      <div id="home" class="home">
        <div class="hscroll">
          <img class="hs" src="assets/app/head.webp" alt="">
          <button class="hbanner" data-go aria-label="트레벤처 시작">
            <img class="hb-logo" src="assets/app/logo.webp" alt="">
            <span class="hb-txt">가족과 함께 떠나는<br><b>트레이더스 탐험!</b></span>
            <span class="hb-cta">지금 시작하기 ▶</span>
            <img class="hb-c hb-c1" src="assets/characters/boy.webp" alt=""><img class="hb-c hb-c2" src="assets/characters/girl.webp" alt="">
            <i class="hb-sp s1">✦</i><i class="hb-sp s2">✦</i><i class="hb-sp s3">✦</i>
            <span class="hb-pg">1/8 <u>❚❚</u> ＋</span>
          </button>
          <img class="hs" src="assets/app/club.webp" alt="">
          <div class="hicons">
            <button class="ic"><img src="assets/app/ic1.webp" alt="금주의전단"></button>
            <button class="ic"><img src="assets/app/ic2.webp" alt="오더픽"></button>
            <button class="ic tv" data-go aria-label="트레벤처"><span class="new">NEW</span><img class="tvl" src="assets/app/logo.webp" alt=""><b>트레벤처</b></button>
            <button class="ic"><img src="assets/app/ic3.webp" alt="오더투홈"></button>
            <button class="ic"><img src="assets/app/ic4.webp" alt="와인그랩"></button>
            <button class="ic"><img src="assets/app/ic5.webp" alt="디지털그랩"></button>
          </div>
          <img class="hs" src="assets/app/story.webp" alt="">
        </div>
        <div class="hnav"><img src="assets/app/navl.webp" alt=""><button class="pay"><img src="assets/app/pay.webp" alt="이마트페이"></button><img src="assets/app/navr.webp" alt=""></div>
      </div>
      <div id="toast" class="toast" role="status" aria-live="polite"></div>
      <div id="loader" class="loader hide"><img class="llogo" src="assets/app/logo.webp" alt="Treventure"><div class="lchars"><img src="assets/characters/boy.webp" alt=""><img src="assets/characters/girl.webp" alt=""></div><div class="track"><div id="bar"></div></div><p id="ltxt">탐험 준비 중...</p></div>
      <input id="camera-input" type="file" accept="image/*" capture="environment" hidden>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
